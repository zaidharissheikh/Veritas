<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in · Ledgerly</title>
</head>
<body>
  <div id="root">
    <div class="app-shell">
      <header class="app-bar">
        <span class="brand">Ledgerly</span>
        <nav><a href="/pricing">Pricing</a> <a href="/help">Help</a></nav>
      </header>
      <main class="auth-card">
        <h1>Welcome back</h1>
        <p>Sign in to continue to your workspace.</p>
        <form action="/session" method="post">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password">
          <button type="submit">Sign in</button>
        </form>
        <p><a href="/forgot">Forgot your password?</a></p>
        <p>New to Ledgerly? <a href="/signup">Create an account</a></p>
      </main>
      <footer class="app-footer">&copy; 2026 Ledgerly Ltd &middot; <a href="/privacy">Privacy</a> &middot; <a href="/terms">Terms</a></footer>
    </div>
  </div>
</body>
</html>
